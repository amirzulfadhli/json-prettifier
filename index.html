<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Prettifier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Simple JSON tool</p>
      <h1>JSON Prettifier</h1>
      <p class="intro">Format, minify, and copy JSON in your browser.</p>
    </header>

    <section class="panel" aria-label="JSON formatter">
      <label for="json-input">Input JSON</label>
      <textarea id="json-input" spellcheck="false" placeholder='{"hello":"world"}'></textarea>
      <div class="actions">
        <button id="format-button" type="button">Format</button>
        <button id="minify-button" class="secondary" type="button">Minify</button>
        <button id="clear-button" class="secondary" type="button">Clear</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>

      <label for="json-output">Output</label>
      <textarea id="json-output" readonly spellcheck="false" aria-label="Formatted JSON output"></textarea>
      <button id="copy-button" class="copy" type="button">Copy output</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
